name: saamay_ai
description: "Saamay AI — Quran memorization, recitation & retention tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  provider: ^6.1.0

  # UI / Fonts
  google_fonts: ^8.0.2

  # Charts (Track feature)
  fl_chart: ^0.66.0

  # Audio (Recite feature)
  audioplayers: ^5.2.0

  # Local storage
  shared_preferences: ^2.2.0

  # Icons (from old project)
  iconsax: ^0.0.8

  # Date formatting
  intl: ^0.19.0
  flutter_dotenv: ^6.0.0

  # Speech Recognition & Recording (Memorize feature)
  speech_to_text: ^7.0.0
  record: ^6.2.0
  http: ^1.2.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
